    <nav class="navbar navbar-expand-lg py-3">

          <ul class="navbar-nav ms-auto align-items-lg-center">

          </ul>
        </div>
<div class="dropdown ms-3">
  <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
    <span id="currentLangIcon" class="fi fi-us"></span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown" id="langDropdownMenu">
    <li><a class="dropdown-item d-flex align-items-center" href="#" data-lang="en"><span class="fi fi-us me-2"></span>English</a></li>
    <li><a class="dropdown-item d-flex align-items-center" href="#" data-lang="de"><span class="fi fi-de me-2"></span>Deutsch</a></li>

    <li><a class="dropdown-item d-flex align-items-center" href="#" data-lang="fr"><span class="fi fi-fr me-2"></span>Français</a></li>
    <li><a class="dropdown-item d-flex align-items-center" href="#" data-lang="it"><span class="fi fi-it me-2"></span>Italiano</a></li>
    <li><a class="dropdown-item d-flex align-items-center" href="#" data-lang="nl"><span class="fi fi-nl me-2"></span>Nederlands</a></li>

</div>
      </div>
    </nav>

    <main class="container-lg">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4 mt-4">
            <h3 class="mb-3" data-i18n="feedback.title">Send us feedback</h3>
            <p class="small text-muted" data-i18n="feedback.description">We appreciate your thoughts — report bugs, suggestions, or general feedback.</p>
            <form id="feedback-form" action="https://formsubmit.co/c7094777df3bc424509d7638ca319a5e" method="POST">
              <div class="mb-3">
                <label class="form-label" data-i18n="feedback.fields.name">Name (optional)</label>
                <input class="form-control" id="name" name="name" placeholder="" data-i18n-placeholder="feedback.fields.name">
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="feedback.fields.email">Email (optional)</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="" data-i18n-placeholder="feedback.fields.email">
              </div>
              <div class="mb-3">
                <label class="form-label" data-i18n="feedback.fields.message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="6" required placeholder="" data-i18n-placeholder="feedback.fields.message"></textarea>
              </div>
              <div class="d-flex justify-content-end">
                <button class="btn btn-primary" type="submit" data-i18n="feedback.submit">Send Feedback</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <footer class="mt-5 footer text-center">
        <p class="mb-1" data-i18n="common.copyright">© 2025 Car Fault</p>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
